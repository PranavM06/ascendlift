name: Backend CI

on:
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ascendlift
          POSTGRES_PASSWORD: ascendlift
          POSTGRES_DB: ascendlift_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ascendlift -d ascendlift_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      ASCENDLIFT_TEST_DATABASE_URL: postgresql+psycopg://ascendlift:ascendlift@localhost:5432/ascendlift_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install dependencies
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check .
      - name: Check formatting
        run: uv run ruff format --check .
      - name: Type check
        run: uv run mypy
      - name: Test with coverage
        run: uv run pytest --cov
