# Local development database only. These credentials are not used anywhere else.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ascendlift
      POSTGRES_PASSWORD: ascendlift
      POSTGRES_DB: ascendlift
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ascendlift -d ascendlift"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  db-data:
